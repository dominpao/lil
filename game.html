function getLang(){ try { return localStorage.getItem('lil-lang') === 'en' ? 'en' : 'es'; } catch(e){ return 'es'; } }
function getId(){ try { return new URLSearchParams(window.location.search).get("id") || "magic-pen"; } catch(e){ return "magic-pen"; } }
let menuOpen = false;
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---- Observation form ---- */
function collectFormState(){
  const f = document.getElementById('lilObserveForm');
  if(!f) return null;
  const g = id => document.getElementById(id);
  const st = { name:(g('lilNameInp')||{}).value||'', email:(g('lilEmailInp')||{}).value||'', childName:(g('lilChildNameInp')||{}).value||'', childAge:(g('lilChildAgeInp')||{}).value||'', discovery:'', questions:[] };
  const ta = f.querySelector('[name=lilDiscovery]'); if(ta) st.discovery = ta.value;
  f.querySelectorAll('.lil-q').forEach(q=>{
    const checked = [...q.querySelectorAll('input[type=checkbox]')].map(c=>c.checked);
    const ot = q.querySelector('.lil-other-text');
    st.questions.push({ checked, otherText: ot ? ot.value : '' });
  });
  return st;
}
function renderObserve(lang){
  const t = UI[lang];
  const raw = D[getId()] || D["magic-pen"];
  const optSets = (raw[lang] || raw.es).observe;
  const prev = collectFormState();

  document.getElementById('lilObsTitle').textContent = t.observe.formTitle;
  document.getElementById('lilObsIntro').innerHTML = t.observe.intro.map(p=>
    `<span style="display:block;margin:0 0 8px">${esc(p)}</span>`).join('');
  document.getElementById('lilNameLbl').textContent = t.observe.nameLabel;
  document.getElementById('lilEmailLbl').textContent = t.observe.emailLabel;
  document.getElementById('lilChildNameLbl').textContent = t.observe.childNameLabel;
  document.getElementById('lilChildAgeLbl').textContent = t.observe.childAgeLabel;
  document.getElementById('lilSubmitBtn').textContent = t.observe.submit;

  let html = '';
  optSets.forEach((opts, qi)=>{
    let rows = opts.map(o=>
      `<label class="lil-optrow"><input class="lil-opt" type="checkbox"><span>${esc(o)}</span></label>`
    ).join('');
    rows += `<label class="lil-optrow"><input class="lil-other-cb" type="checkbox" onchange="toggleOther(${qi})"><span>${esc(t.observe.otherLabel)}</span></label>`;
    rows += `<input class="lil-other-text lil-inp" type="text" placeholder="${esc(t.observe.otherPlaceholder)}" style="display:none;margin-left:27px;width:calc(100% - 27px)">`;
    html += `<fieldset class="lil-q" data-qi="${qi}"><legend>${esc(t.observe.questions[qi])}</legend>${rows}</fieldset>`;
  });
  html += `<fieldset class="lil-q5"><legend>${esc(t.observe.questions[4])}</legend><textarea name="lilDiscovery" class="lil-inp" rows="3" placeholder="${esc(t.observe.q5Placeholder)}" style="resize:vertical;min-height:84px"></textarea></fieldset>`;
  document.getElementById('lilQuestions').innerHTML = html;

  if(prev){
    const n=document.getElementById('lilNameInp'); if(n) n.value=prev.name;
    const e=document.getElementById('lilEmailInp'); if(e) e.value=prev.email;
    const cn=document.getElementById('lilChildNameInp'); if(cn) cn.value=prev.childName;
    const ca=document.getElementById('lilChildAgeInp'); if(ca) ca.value=prev.childAge;
    const ta=document.querySelector('[name=lilDiscovery]'); if(ta) ta.value=prev.discovery;
    document.querySelectorAll('.lil-q').forEach((q,qi)=>{
      const st=prev.questions[qi]; if(!st) return;
      const cbs=q.querySelectorAll('input[type=checkbox]');
      st.checked.forEach((v,ci)=>{ if(cbs[ci]) cbs[ci].checked=v; });
      const ot=q.querySelector('.lil-other-text'), ocb=q.querySelector('.lil-other-cb');
      if(ot){ ot.value=st.otherText; if(ocb && ocb.checked) ot.style.display='block'; }
    });
  }
}
function toggleOther(qi){
  const q=document.querySelector('.lil-q[data-qi="'+qi+'"]');
  const cb=q.querySelector('.lil-other-cb'), txt=q.querySelector('.lil-other-text');
  txt.style.display = cb.checked ? 'block' : 'none';
  if(cb.checked) txt.focus();
}
function buildMessage(lang){
  const t = UI[lang];
  const raw = D[getId()] || D["magic-pen"];
  const optSets = (raw[lang] || raw.es).observe;
  const lines = [ t.observe.formTitle + " — " + raw.name, "" ];
  const childName = (document.getElementById('lilChildNameInp').value||'').trim();
  const childAge = (document.getElementById('lilChildAgeInp').value||'').trim();
  if(childName) lines.push(t.observe.childNameMsg + ": " + childName);
  if(childAge) lines.push(t.observe.childAgeMsg + ": " + childAge);
  if(childName || childAge) lines.push("");
  document.querySelectorAll('.lil-q').forEach((q,qi)=>{
    lines.push(t.observe.questions[qi]);
    const selected = [];
    q.querySelectorAll('.lil-opt').forEach((cb,oi)=>{ if(cb.checked) selected.push(optSets[qi][oi]); });
    const ocb=q.querySelector('.lil-other-cb');
    if(ocb && ocb.checked){ const ot=(q.querySelector('.lil-other-text').value||'').trim(); selected.push(t.observe.otherLabel + (ot ? ": " + ot : "")); }
    if(selected.length) selected.forEach(s=>lines.push("• " + s)); else lines.push("—");
    lines.push("");
  });
  const disc = (document.querySelector('[name=lilDiscovery]').value||'').trim();
  lines.push(t.observe.questions[4]);
  lines.push(disc || "—");
  return lines.join("\n");
}
async function submitObserve(e){
  e.preventDefault();
  const lang = getLang(), t = UI[lang];
  const name = document.getElementById('lilNameInp').value.trim();
  const email = document.getElementById('lilEmailInp').value.trim();
  const status = document.getElementById('lilFormStatus');
  const btn = document.getElementById('lilSubmitBtn');
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!name || !emailOk){
    status.style.color = '#c0392b';
    status.textContent = t.observe.needFields;
    return false;
  }
  let captchaToken = '';
  if(CAPTCHA_ENABLED){
    const captchaField = document.querySelector('#lilObserveForm [name="h-captcha-response"]');
    captchaToken = captchaField ? captchaField.value : '';
    if(!captchaToken){
      status.style.color = '#c0392b';
      status.textContent = t.observe.needCaptcha;
      return false;
    }
  }
  const raw = D[getId()] || D["magic-pen"];
  const fd = new FormData();
  fd.append('access_key', WEB3FORMS_KEY);
  fd.append('from_name', 'Lil4Change');
  fd.append('subject', t.observe.formTitle + ' — ' + raw.name);
  fd.append('name', name);
  fd.append('email', email);
  if(CAPTCHA_ENABLED) fd.append('h-captcha-response', captchaToken);
  fd.append('message', buildMessage(lang));
  btn.disabled = true; btn.style.opacity = '.7'; btn.textContent = t.observe.sending;
  status.style.color = '#6b7c98'; status.textContent = '';
  try {
    const res = await fetch('https://api.web3forms.com/submit', { method:'POST', body: fd });
    const data = await res.json();
    if(data.success){
      status.style.color = '#1f8a5b';
      status.innerHTML = t.observe.successMsg.map(p=>
        `<span style="display:block;margin:0 0 7px;line-height:1.5">${esc(p)}</span>`).join('');
      document.getElementById('lilObserveForm').reset();
      document.querySelectorAll('.lil-other-text').forEach(x=>x.style.display='none');
      try { if(CAPTCHA_ENABLED && window.hcaptcha) window.hcaptcha.reset(); } catch(e){}
    } else {
      status.style.color = '#c0392b';
      status.textContent = t.observe.errorMsg;
      try { if(CAPTCHA_ENABLED && window.hcaptcha) window.hcaptcha.reset(); } catch(e){}
    }
  } catch(err){
    status.style.color = '#c0392b';
    status.textContent = t.observe.errorMsg;
    try { if(CAPTCHA_ENABLED && window.hcaptcha) window.hcaptcha.reset(); } catch(e){}
  }
  btn.disabled = false; btn.style.opacity = '1'; btn.textContent = t.observe.submit;
  return false;
}

  const t = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (t[k] != null) el.textContent = t[k];
  });
  const id = getId();
  const raw = D[id] || D["magic-pen"];
  const loc = raw[lang];
  document.title = raw.name + " — Lil4Change";
  document.getElementById('lilCrumbName').textContent = raw.name;
  document.getElementById('lilHeroBg').src = raw.img;
  document.getElementById('lilHeroThumb').src = raw.img;
  document.getElementById('lilHeroThumb').alt = raw.name;
  document.getElementById('lilGameName').textContent = raw.name;
  document.getElementById('lilPitch').textContent = loc.pitch;
  document.getElementById('lilTags').innerHTML = loc.tags.map(tg=>
    `<span style="background:rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.3px;padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px)">${esc(tg)}</span>`).join('');
  document.getElementById('lilAboutLabel').textContent = t.aboutLabel;
  document.getElementById('lilAbout').innerHTML = loc.about.map(p=>
    `<p style="font-size:16px;line-height:1.65;color:#51617b;margin:0">${esc(p)}</p>`).join('');
  document.getElementById('lilWhyLabel').textContent = t.whyLabel;
  document.getElementById('lilWhy').textContent = loc.why;
  renderObserve(lang);
  document.querySelectorAll('.lil-free').forEach(e=>e.textContent = t.freeLabel);
  document.querySelectorAll('.lil-playnow').forEach(e=>e.textContent = t.playNow);
  document.querySelectorAll('.lil-playlink').forEach(e=>e.href = raw.url);
  document.querySelectorAll('.lil-opensext').forEach(e=>e.textContent = t.opensExternal);
  document.getElementById('lilBackToGames').textContent = t.backToGames;
  const facts = [
    {k:t.factKeys.genre, v:raw.facts.genre[lang]},
    {k:t.factKeys.players, v:raw.facts.players[lang]},
    {k:t.factKeys.device, v:raw.facts.device[lang]},
    {k:t.factKeys.cost, v:t.freeLabel},
    {k:t.factKeys.ages, v:raw.facts.ages[lang]}
  ];
  document.getElementById('lilFacts').innerHTML = facts.map(f=>
    `<div style="display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid rgba(63,127,212,.1)"><span style="font-size:14px;color:#8a9ab4;font-weight:700">${esc(f.k)}</span><span style="font-size:14px;color:#3a4a63;font-weight:700;text-align:right">${esc(f.v)}</span></div>`).join('');
  const on = "color:#22334d;font-weight:800", off = "color:#93a3bd;font-weight:600";
  ['lilEsA','lilEsB'].forEach(id=>{ const e=document.getElementById(id); if(e) e.style.cssText = lang==='es'?on:off; });
  ['lilEnA','lilEnB'].forEach(id=>{ const e=document.getElementById(id); if(e) e.style.cssText = lang==='en'?on:off; });
  try { localStorage.setItem('lil-lang', lang); } catch(e){}
}
