<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos — Lil4Change</title>
<meta name="description" content="Nuestra selección de videojuegos.">
<link rel="icon" href="assets/lil-logo7.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:"Nunito",system-ui,sans-serif;background:#f6f4ef;color:#2b3a53;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  @keyframes lilRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes lilDandelionIdle{0%,100%{transform:translate(0,0)}50%{transform:translate(1px,-4px)}}
  @media (max-width:760px){ .lil-navlinks{display:none !important} .lil-hamburger{display:flex !important} .lil-desktoponly{display:none !important} }
  @media (max-width:480px){ .lil-tagline{display:none !important} }
  .lil-gamecard{transition:transform .18s ease,box-shadow .18s ease}
  .lil-gamecard:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(63,127,212,.17)}
</style>
</head>
<body>
<div style="min-height:100vh">

  <!-- NAV -->
  <header style="position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);background:rgba(246,244,239,.78);border-bottom:1px solid rgba(63,127,212,.12)">
    <nav style="max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px">
      <a href="index.html" style="display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;margin-right:auto">
        <img src="assets/lil-logo7.png" alt="Lil4Change" style="width:44px;height:44px;border-radius:50%;box-shadow:0 4px 14px rgba(20,32,64,.28)">
        <span style="display:flex;flex-direction:column;line-height:1">
          <span style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;letter-spacing:.2px;color:#26364f">Lil<span style="color:#3f7fd4">4</span>Change</span>
          <span class="lil-tagline" style="font-size:10.5px;color:#6b7c98;margin-top:3px;letter-spacing:.3px">Life is Learning</span>
        </span>
      </a>
      <div style="display:flex;align-items:center;gap:24px" class="lil-navlinks">
        <a href="index.html" data-i18n="navHome" style="color:#42536e;text-decoration:none;font-weight:700;font-size:15px">Inicio</a>
        <a href="about.html" data-i18n="navAbout" style="color:#42536e;text-decoration:none;font-weight:700;font-size:15px">Sobre Lil</a>
        <a href="games.html" data-i18n="navGames" style="color:#3f7fd4;text-decoration:none;font-weight:800;font-size:15px">Juegos</a>
        <a href="contact.html" data-i18n="navContact" style="color:#42536e;text-decoration:none;font-weight:700;font-size:15px">Contacto</a>
      </div>
      <button onclick="toggleMenu()" aria-label="Menu" class="lil-hamburger" style="display:none;align-items:center;justify-content:center;width:42px;height:42px;background:rgba(63,127,212,.1);border:1px solid rgba(63,127,212,.28);border-radius:12px;cursor:pointer;order:5">
        <svg id="lilIconOpen" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#3f7fd4" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="17" y2="6"></line><line x1="3" y1="10" x2="17" y2="10"></line><line x1="3" y1="14" x2="17" y2="14"></line></svg>
        <svg id="lilIconClose" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#3f7fd4" stroke-width="2" stroke-linecap="round" style="display:none"><line x1="4" y1="4" x2="16" y2="16"></line><line x1="16" y1="4" x2="4" y2="16"></line></svg>
      </button>
      <button onclick="toggleLang()" aria-label="Toggle language" class="lil-desktoponly" style="display:flex;align-items:center;gap:6px;background:rgba(63,127,212,.08);border:1px solid rgba(63,127,212,.25);color:#3f7fd4;font-family:'Nunito';font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer">
        <span id="lilEsA">ES</span><span style="opacity:.4">/</span><span id="lilEnA">EN</span>
      </button>
    </nav>
    <div id="lilMobileMenu" style="display:none;flex-direction:column;padding:8px 24px 20px;gap:2px;border-top:1px solid rgba(63,127,212,.12)">
      <a href="index.html" onclick="closeMenu()" data-i18n="navHome" style="color:#2b3a53;text-decoration:none;font-weight:700;font-size:17px;padding:13px 4px">Inicio</a>
      <a href="about.html" onclick="closeMenu()" data-i18n="navAbout" style="color:#2b3a53;text-decoration:none;font-weight:700;font-size:17px;padding:13px 4px;border-top:1px solid rgba(63,127,212,.1)">Sobre Lil</a>
      <a href="games.html" onclick="closeMenu()" data-i18n="navGames" style="color:#3f7fd4;text-decoration:none;font-weight:800;font-size:17px;padding:13px 4px;border-top:1px solid rgba(63,127,212,.1)">Juegos</a>
      <a href="contact.html" onclick="closeMenu()" data-i18n="navContact" style="color:#2b3a53;text-decoration:none;font-weight:700;font-size:17px;padding:13px 4px;border-top:1px solid rgba(63,127,212,.1)">Contacto</a>
      <div style="display:flex;align-items:center;gap:12px;padding:14px 4px 6px;border-top:1px solid rgba(63,127,212,.1)">
        <span data-i18n="langLabel" style="font-size:14px;font-weight:700;color:#6b7c98">Idioma</span>
        <button onclick="toggleLang()" aria-label="Toggle language" style="display:flex;align-items:center;gap:6px;background:rgba(63,127,212,.08);border:1px solid rgba(63,127,212,.25);color:#3f7fd4;font-family:'Nunito';font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer"><span id="lilEsB">ES</span><span style="opacity:.4">/</span><span id="lilEnB">EN</span></button>
      </div>
    </div>
  </header>

  <!-- PAGE HERO -->
  <section style="position:relative;overflow:hidden;background:linear-gradient(180deg,#dcecfb 0%,#eaf4fc 55%,#f6f4ef 100%);padding:76px 24px 40px">
    <div style="position:relative;max-width:820px;margin:0 auto;text-align:center">
      <span data-i18n="gamesTag" style="display:inline-block;color:#3f7fd4;font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;animation:lilRise .6s ease-out both">Juegos</span>
      <h1 data-i18n="gamesTitle" style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(32px,5.2vw,54px);line-height:1.08;letter-spacing:-.5px;margin:14px 0 0;color:#22334d;animation:lilRise .6s ease-out .1s both">Nuestra selección de videojuegos</h1>
      <div style="width:66px;height:4px;border-radius:99px;background:linear-gradient(90deg,#5a97e6,#3f7fd4);margin:24px auto 0"></div>
    </div>
  </section>

  <!-- ANTES DE EMPEZAR -->
  <section style="max-width:900px;margin:0 auto;padding:32px 24px 0">
    <div style="background:#fff;border:1px solid rgba(234,181,78,.32);border-radius:22px;padding:28px 30px;box-shadow:0 12px 30px rgba(234,181,78,.1)">
      <h2 data-i18n="beforeTitle" style="font-family:'Fredoka';font-weight:600;font-size:20px;margin:0 0 16px;color:#22334d">Antes de empezar</h2>
      <div id="lilBeforeItems" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>
  </section>

  <!-- GAME GRID -->
  <section style="max-width:1120px;margin:0 auto;padding:36px 24px 8px">
    <div id="lilGamesGrid" style="display:flex;flex-wrap:wrap;justify-content:center;gap:22px"></div>
  </section>

  <!-- FOOTER -->
  <footer style="max-width:1120px;margin:44px auto 0;padding:44px 24px 48px;border-top:1px solid rgba(63,127,212,.14)">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:32px">
      <div>
        <a href="index.html" style="display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;margin-bottom:16px">
          <img src="assets/lil-logo7.png" alt="Lil4Change" style="width:40px;height:40px;border-radius:50%">
          <span style="font-family:'Fredoka';font-weight:600;font-size:18px;color:#26364f">Lil<span style="color:#3f7fd4">4</span>Change</span>
        </a>
        <p data-i18n="footerDesc" style="font-size:15px;line-height:1.6;color:#51617b;margin:0;max-width:320px"></p>
      </div>
      <div>
        <h5 data-i18n="footerNavTitle" style="font-family:'Fredoka';font-weight:600;font-size:16px;color:#26364f;margin:0 0 16px">Navegación</h5>
        <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px">
          <li><a href="index.html" data-i18n="navHome" style="color:#51617b;text-decoration:none;font-weight:600;font-size:15px">Inicio</a></li>
          <li><a href="about.html" data-i18n="navAbout" style="color:#51617b;text-decoration:none;font-weight:600;font-size:15px">Sobre Lil</a></li>
          <li><a href="games.html" data-i18n="navGames" style="color:#51617b;text-decoration:none;font-weight:600;font-size:15px">Juegos</a></li>
          <li><a href="contact.html" data-i18n="navContact" style="color:#51617b;text-decoration:none;font-weight:600;font-size:15px">Contacto</a></li>
        </ul>
      </div>
    </div>
    <div data-i18n="footerCopyright" style="margin-top:36px;padding-top:24px;border-top:1px solid rgba(63,127,212,.12);text-align:center;font-size:13.5px;color:#6b7c98"></div>
  </footer>
</div>

<script>
const GAMES = [
  {id:"magic-pen", name:"Magic Pen", img:"assets/games/magic-pen.jpg"},
  {id:"bridge-builder", name:"Bridge Builder", img:"assets/games/bridge-builder.jpg"},
  {id:"yellow", name:"Yellow", img:"assets/games/yellow.jpg"},
  {id:"factory-balls", name:"Factory Balls Forever", img:"assets/games/factory-balls.jpg"},
  {id:"monument-valley", name:"Monument Valley", img:"assets/games/monument-valley.jpg"}
];
const DICT = {
  es: {
    navHome:"Inicio", navAbout:"Sobre Lil", navGames:"Juegos", navContact:"Contacto", langLabel:"Idioma",
    gamesTag:"Juegos",
    gamesTitle:"Nuestra selección de videojuegos",
    beforeTitle:"Antes de empezar",
    beforeItems:[
      {icon:"🖥️", text:"Esta selección fue pensada para jugar en computadora o notebook."},
      {icon:"🖱️", text:"Para aprovechar mejor la experiencia recomendamos utilizar mouse."},
      {icon:"📱", text:"Algunos juegos pueden abrirse desde celulares o tablets, pero no fueron diseñados para esos dispositivos y la experiencia puede verse limitada."}
    ],
    viewMore:"Ver más",
    footerDesc:"Life is Learning. Transformando el tiempo de pantalla en tiempo de crecimiento.",
    footerNavTitle:"Navegación",
    footerCopyright:"© 2026 Lil4Change. Todos los derechos reservados."
  },
  en: {
    navHome:"Home", navAbout:"About Lil", navGames:"Games", navContact:"Contact", langLabel:"Language",
    gamesTag:"Games",
    gamesTitle:"Our video game selection",
    beforeTitle:"Before you start",
    beforeItems:[
      {icon:"🖥️", text:"This selection is designed to be played on a computer or laptop."},
      {icon:"🖱️", text:"For the best experience we recommend using a mouse."},
      {icon:"📱", text:"Some games can be opened on phones or tablets, but they weren't designed for those devices and the experience may be limited."}
    ],
    viewMore:"View more",
    footerDesc:"Life is Learning. Turning screen time into growth time.",
    footerNavTitle:"Navigation",
    footerCopyright:"© 2026 Lil4Change. All rights reserved."
  }
};

function getLang(){ try { return localStorage.getItem('lil-lang') === 'en' ? 'en' : 'es'; } catch(e){ return 'es'; } }
let menuOpen = false;
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const ARROW = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3f7fd4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';

function applyLang(lang){
  const t = DICT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (t[k] != null) el.textContent = t[k];
  });
  document.getElementById('lilBeforeItems').innerHTML = t.beforeItems.map(bi=>
    `<div style="display:flex;gap:14px;align-items:flex-start"><span style="font-size:22px;line-height:1.4;flex:none">${bi.icon}</span><p style="font-size:15.5px;line-height:1.55;color:#51617b;margin:0">${esc(bi.text)}</p></div>`
  ).join('');
  document.getElementById('lilGamesGrid').innerHTML = GAMES.map(g=>
    `<a href="game.html?id=${g.id}" class="lil-gamecard" style="flex:1 1 300px;max-width:340px;display:flex;flex-direction:column;text-decoration:none;background:#fff;border:1px solid rgba(63,127,212,.14);border-radius:20px;overflow:hidden;box-shadow:0 10px 26px rgba(63,127,212,.07)"><div style="aspect-ratio:16/10;overflow:hidden;background:#eaf2fb"><img src="${g.img}" alt="${esc(g.name)}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block"></div><div style="padding:18px 20px 20px;display:flex;flex-direction:column;gap:11px"><h3 style="font-family:'Fredoka';font-weight:600;font-size:19px;margin:0;color:#22334d">${esc(g.name)}</h3><span style="display:inline-flex;align-items:center;gap:7px;color:#3f7fd4;font-weight:800;font-size:14px">${esc(t.viewMore)} ${ARROW}</span></div></a>`
  ).join('');
  const on = "color:#22334d;font-weight:800", off = "color:#93a3bd;font-weight:600";
  ['lilEsA','lilEsB'].forEach(id=>document.getElementById(id).style.cssText = lang==='es'?on:off);
  ['lilEnA','lilEnB'].forEach(id=>document.getElementById(id).style.cssText = lang==='en'?on:off);
  try { localStorage.setItem('lil-lang', lang); } catch(e){}
}
function toggleLang(){ applyLang(getLang()==='es'?'en':'es'); }
function toggleMenu(){
  menuOpen = !menuOpen;
  document.getElementById('lilMobileMenu').style.display = menuOpen ? 'flex' : 'none';
  document.getElementById('lilIconOpen').style.display = menuOpen ? 'none' : 'block';
  document.getElementById('lilIconClose').style.display = menuOpen ? 'block' : 'none';
}
function closeMenu(){ if(menuOpen) toggleMenu(); }

applyLang(getLang());
</script>
</body>
</html>
